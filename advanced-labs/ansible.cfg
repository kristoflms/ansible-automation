# ansible.cfg
#
# This configuration file defines how Ansible behaves by default.
# It is suitable for mixed environments where you manage:
# - Linux servers
# - Cisco network devices
# - Aruba AOS-CX network devices
#
# Place this file in the root of your Ansible project so Ansible
# automatically picks it up when you run commands from that directory.

[defaults]

# Path to the inventory file or directory.
# This can point to a single file or a directory containing multiple inventory files.
# Example:
# inventory = ./inventory/hosts.yml
inventory = ./inventory/hosts.yml

# Path(s) where Ansible looks for roles.
# Useful when you build reusable roles for Linux or network automation.
# Multiple paths can be separated with a colon.
roles_path = ./roles:~/.ansible/roles:/usr/share/ansible/roles

# Path(s) where Ansible looks for collections.
# Important for vendor-specific collections such as:
# - cisco.ios
# - arubanetworks.aoscx
collections_path = ./collections:~/.ansible/collections:/usr/share/ansible/collections

# Disable SSH host key checking.
# This is convenient in labs, dynamic environments, and when devices are rebuilt often.
# In stricter production environments, you may want to set this to True.
host_key_checking = False

# Avoid creating retry files like playbook.retry after failed runs.
# This keeps the project directory cleaner.
retry_files_enabled = False

# Controls how many hosts Ansible works on in parallel.
# A moderate value is good for mixed Linux/network environments.
forks = 20

# Display the task execution time in the output.
# Helpful for spotting slow tasks or connections.
callbacks_enabled = ansible.posix.profile_tasks

# Use YAML-style output for cleaner and easier-to-read results.
# This is especially helpful when reading facts or structured module output.
stdout_callback = yaml

# Makes Ansible display skipped hosts/tasks more clearly.
bin_ansible_callbacks = True

# Controls whether Ansible warns about interpreter discovery.
# Auto is usually fine for modern Linux systems.
interpreter_python = auto

# Timeout in seconds for operations such as SSH connection establishment.
# Network devices can sometimes be slower than Linux hosts.
timeout = 30

# Disable "cow" output formatting if the package is installed.
# Keeps output cleaner and more professional.
nocows = True

# Enable gathering of local facts from fact cache if configured.
# Smart gathering reduces unnecessary fact collection.
gathering = smart

# Fact caching can speed up repeated runs against Linux hosts.
# The jsonfile backend stores cached facts locally in a directory.
fact_caching = jsonfile

# Directory where cached facts are stored.
fact_caching_connection = ./.fact_cache

# Cache timeout in seconds.
# 86400 seconds = 24 hours.
fact_caching_timeout = 86400

# By default, Ansible checks SSH keys in ~/.ssh.
# If you use a dedicated automation key, you can uncomment the next line.
# private_key_file = ~/.ssh/ansible_id_rsa

# Log file location.
# Useful for troubleshooting playbooks and keeping a history of runs.
# Uncomment if you want logging enabled.
# log_path = ./ansible.log

# Suppress warnings about command module usage and similar hints.
# Leave commented if you want to see all guidance from Ansible.
# command_warnings = False

# Controls whether deprecation warnings are shown.
# Keep this enabled while learning or maintaining playbooks so you can catch old syntax.
deprecation_warnings = True

# Do not display skipped hosts with a lot of noise in some workflows.
# Uncomment if you prefer quieter output.
# display_skipped_hosts = False


[inventory]

# Enables inventory plugins.
# YAML inventory is commonly used for Linux + network environments.
enable_plugins = host_list, script, auto, yaml, ini, toml


[privilege_escalation]

# These settings control privilege escalation on Linux systems.
# They do NOT apply to network_cli/httpapi device management.
# Typical use case:
# - connect as a normal Linux user
# - escalate to root with sudo when needed

# Enable privilege escalation support globally.
become = True

# Use sudo for privilege escalation on Linux.
become_method = sudo

# Default become user.
become_user = root

# If set to True, Ansible will ask for the sudo password.
# Usually left False if you use passwordless sudo.
become_ask_pass = False


[ssh_connection]

# Use OpenSSH for transport.
# This is the standard and usually most reliable option for Linux and network_cli.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s

# Reuse SSH sessions for better performance.
# This speeds up repeated tasks on the same host.
pipelining = True

# Number of SSH connection attempts before giving up.
retries = 3

# Directory where SSH control sockets are stored.
# Helps Ansible reuse SSH sessions efficiently.
control_path_dir = ~/.ansible/cp

# Transfer files using sftp by default.
# This is typically fine for Linux hosts.
# Network devices usually do not need file transfer for normal CLI tasks.
transfer_method = smart


[persistent_connection]

# These settings are important for network devices using persistent connections.
# They affect plugins such as network_cli and httpapi.

# Time in seconds to keep a persistent connection alive.
connect_timeout = 30

# Time in seconds to wait for a command to complete on a persistent connection.
command_timeout = 60

# Time in seconds to wait when initially establishing a persistent connection.
connect_retry_timeout = 15


[paramiko_connection]

# If Paramiko is used instead of OpenSSH, this controls host key handling.
# Usually not needed if OpenSSH works properly, but harmless to define.
host_key_auto_add = True

# Look for SSH keys in the user's SSH agent or known default locations.
look_for_keys = True


[colors]

# Optional output colors for readability in terminal sessions.
# Comment out if you prefer default colors.
verbose = blue
warn = bright purple
error = red
debug = dark gray
changed = yellow
deprecate = purple
skip = cyan
unreachable = bright red
ok = green
